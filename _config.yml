title: "Research project website"
description: "A configurable static website for research project communications."
url: "https://PaulineLawrey.github.io"
baseurl: "/jcu-research-website-theme"

markdown: kramdown
kramdown:
  input: GFM

theme_settings:
  show_breadcrumbs: true
  favicon: "/assets/images/favicon.svg"
  project_logo: "/assets/sample-images/project-logo.svg"
  project_logo_alt: "Project logo"

  sidebar_logo_tile_background: "transparent"
  sidebar_logo_tile_border_color: "transparent"
  # Optional project-logo-specific overrides. Leave commented to use the sidebar logo tile settings above.
  sidebar_project_logo_tile_background: "#transparent"
  sidebar_project_logo_tile_border_color: "transparent"

  font_family: "Lato, Arial, Helvetica, sans-serif"
  heading_font_family: "Lora, Georgia, serif"

  primary_color: "#354F52"
  primary_text_color: "#FFFFFF"
  primary_link_color: "#FFFFFF"

  secondary_color: "#C3D5C7"
  secondary_text_color: "#354F52"
  secondary_link_color: "#354F52"

  text_color: "#354f52"
  heading_color: "#344054"

  background_color: "#F4F6F3"
  background_text_color: "#354F52"
  background_link_color: "#354F52"

  surface_color: "#FFFFFF"
  surface_text_color: "#354F52"
  surface_link_color: "#354F52"

  warning_color: "#86466E"
  warning_text_color: "#354F52"
  warning_link_color: "#354F52"

  border_color: "#D0D5DD"

  # content_alignment options: "left", "center"
  content_alignment: "left"
  # button_shape options: "rectangular", "lozenge"
  button_shape: "rectangular"
  table_banded_rows: true

  # block_separator_style options: "none", "line", "accent", "band"
  block_separator_style: "none"
  landing_block_separators: false

  partner_logo_max_height: "6rem"
  partner_logo_max_items_per_row: 3

  image_gallery_max_items_per_row: 3

  page_card_columns: 3
  page_card_link_text: "Read more"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - full_width_page_styles.md
  - README.md
